[tool.poetry]
name = "face-analyzer"
version = "0.1.0"
description = "Standalone FastAPI service for S3 video face analysis callbacks"
authors = ["ziwon <nayanako03@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.135.2,<0.136.0"
uvicorn = { extras = ["standard"], version = ">=0.42.0,<0.43.0" }
pydantic = ">=2.12.5,<3.0.0"
httpx = ">=0.27.0,<1.0.0"
boto3 = ">=1.34.0,<2.0.0"
opencv-python = "^4.13.0.92"
insightface = "^0.7.3"
onnxruntime = ">=1.25.1,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
