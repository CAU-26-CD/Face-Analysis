<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re:Action — 카메라 연결</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e8e8e8;
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #000;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #000;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .qr-wrap {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    #qrcode canvas, #qrcode img {
      border-radius: 8px;
    }
    .code-label {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .code-display {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #000;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .expire {
      font-size: 11px;
      color: #bbb;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #eee;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.waiting { background: #ccc; animation: pulse 1.5s ease-in-out infinite; }
    .status-dot.connected { background: #2ea86b; animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-text {
      font-size: 13px;
      color: #555;
    }
    .btn-refresh {
      width: 100%;
      padding: 11px;
      background: transparent;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-refresh:hover { background: #f5f5f5; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
      color: #ccc;
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eee;
    }
    .connected-view {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    .connected-view.show { display: block; }
    .check-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #d4f1e4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .connected-title {
      font-size: 16px;
      font-weight: 600;
      color: #000;
      margin-bottom: 4px;
    }
    .connected-sub {
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Re:Action</div>
    <h1>휴대폰 카메라 연결</h1>
    <p class="desc">QR 코드를 스캔하면 카메라 앱이 자동으로 실행됩니다.</p>

    <div class="qr-wrap" id="qrSection">
      <div id="qrcode"></div>
      <div style="text-align:center">
        <div class="code-label">또는 직접 입력</div>
        <div class="code-display" id="codeDisplay">— — —</div>
        <div class="expire" id="expireText">생성 중...</div>
      </div>
    </div>

    <div class="status-row">
      <div class="status-dot waiting" id="statusDot"></div>
      <span class="status-text" id="statusText">연결 대기 중...</span>
    </div>

    <div class="connected-view" id="connectedView">
      <div class="check-circle">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 10l4.5 4.5 7.5-8" stroke="#2ea86b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="connected-title">핸드폰이 연결됐어요!</div>
      <div class="connected-sub">이제 핸드폰에서 촬영을 시작하세요.</div>
    </div>

    <button class="btn-refresh" onclick="generateSession()">새 코드 생성</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    let sessionId = '';
    let pollTimer = null;
    let expireTimer = null;
    let timeLeft = 300;
    let qr = null;

    function makeCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) {
        if (i === 2 || i === 4) code += ' · ';
        code += chars[Math.floor(Math.random() * chars.length)];
      }
      return code;
    }

    function generateSession() {
      clearInterval(pollTimer);
      clearInterval(expireTimer);

      sessionId = Math.random().toString(36).slice(2, 10).toUpperCase();
      const code = makeCode();
      timeLeft = 300;

      document.getElementById('codeDisplay').textContent = code;
      document.getElementById('connectedView').classList.remove('show');
      document.getElementById('statusDot').className = 'status-dot waiting';
      document.getElementById('statusText').textContent = '연결 대기 중...';

      // QR에 담길 URL — 핸드폰이 접속할 카메라 페이지
      const origin = location.origin;
      const camUrl = `${origin}/camera.html?session=${sessionId}&code=${encodeURIComponent(code)}`;

      const qrEl = document.getElementById('qrcode');
      qrEl.innerHTML = '';
      qr = new QRCode(qrEl, {
        text: camUrl,
        width: 160,
        height: 160,
        colorDark: '#000',
        colorLight: '#f9f9f9',
        correctLevel: QRCode.CorrectLevel.M
      });

      // 만료 카운트다운
      expireTimer = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('expireText').textContent = `${m}:${s} 후 만료`;
        if (timeLeft <= 0) {
          clearInterval(expireTimer);
          document.getElementById('expireText').textContent = '만료됨 — 새 코드를 생성하세요';
        }
      }, 1000);

      // 연결 폴링 (localStorage로 같은 기기 테스트 가능)
      pollTimer = setInterval(() => {
        const connected = localStorage.getItem('reaction_connected_' + sessionId);
        if (connected === 'true') {
          clearInterval(pollTimer);
          onConnected();
        }
      }, 1000);
    }

    function onConnected() {
      document.getElementById('statusDot').className = 'status-dot connected';
      document.getElementById('statusText').textContent = '연결됨 — 핸드폰에서 촬영을 시작하세요';
      document.getElementById('connectedView').classList.add('show');
    }

    // 시작
    generateSession();

    // Service Worker 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log('SW 등록 완료'))
        .catch(err => console.error('SW 실패', err));
    }
  </script>
</body>
</html>
