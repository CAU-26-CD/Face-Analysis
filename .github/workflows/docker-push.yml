name: Build and push Docker image

on:
  push:
    branches: [main, demo/fast-face-analysis]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # RunPod's New release dialog rejects 40-char tags as digests, so we
      # publish a short (7-char) SHA tag alongside the full one — that's the
      # value you paste into RunPod to force a rollout.
      #
      # The moving tag is branch-scoped so the demo branch never clobbers the
      # production image: main -> :serverless, demo/* -> :demo.
      - name: Compute tags
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "moving_tag=serverless" >> "$GITHUB_OUTPUT"
            echo "sha_prefix=" >> "$GITHUB_OUTPUT"
          else
            echo "moving_tag=demo" >> "$GITHUB_OUTPUT"
            echo "sha_prefix=demo-" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            lyemee/face-analyzer:${{ steps.vars.outputs.moving_tag }}
            lyemee/face-analyzer:${{ steps.vars.outputs.sha_prefix }}${{ github.sha }}
            lyemee/face-analyzer:${{ steps.vars.outputs.sha_prefix }}${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
